name: build

on:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Homeland
        uses: actions/checkout@v4
        with:
          path: Rivet.Homeland

      - name: Checkout Rivet
        uses: actions/checkout@v4
        with:
          repository: SamV522/Rivet
          path: Rivet

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build Homeland
        run: dotnet build Rivet.Homeland/Rivet.Homeland.csproj -c Release -p:RivetRoot="$GITHUB_WORKSPACE/Rivet"
