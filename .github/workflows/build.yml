name: build

on:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Environment
        run: |
          dotnet --info
          git --version

      - name: Checkout sources
        run: |
          git clone --depth 1 --branch homeland-playable-validation https://github.com/SamV522/Rivet.Homeland.git Rivet.Homeland
          git clone --depth 1 https://github.com/SamV522/Rivet.git Rivet

      - name: Build Homeland
        run: dotnet build Rivet.Homeland/Rivet.Homeland.csproj -c Release -p:RivetRoot="$GITHUB_WORKSPACE/Rivet"
